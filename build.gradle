plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

// The obfuscated release line, Minecraft 1.20 through 1.21.11. Every release here is obfuscated, so each
// needs its own official -> intermediary mappings bundled into the jar (the obfuscated names differ per
// version, so a wrongly built jar would remap OptiFine into nonsense) - which is why one jar is always built
// for exactly one release. The fixers in src/main/java/.../patcher/fixes are written against intermediary
// ids, which are stable across the obfuscated releases, so the same sources serve all of them.
//
// The default release comes from gradle.properties and -Pmc=<version> builds another one:
//
//   .\gradlew build "-Pmc=1.21.8"
//
// The unobfuscated 26.x line is a separate source tree (see docs/LINES.md); its fixers address the game by
// official name instead, and the two registration tables are not interchangeable.
def targetMc = (project.findProperty("mc") ?: project.minecraft_version).toString()

// Yarn is published per release and its build number is part of the version string, so the supported releases
// are listed here (latest yarn build of each). Adding a release is one line.
//
// 1.20.3 and 1.20.5 are in here deliberately even though OptiFine publishes no build for either: the
// project's rule is that the release list follows Fabric/Yarn, and a release only drops out when it cannot
// be built at all. OptifineVersion refuses to run with a mismatched OptiFine jar anyway.
def yarnBuilds = [
        "1.20"    : "1.20+build.1",
        "1.20.1"  : "1.20.1+build.10",
        "1.20.2"  : "1.20.2+build.4",
        "1.20.3"  : "1.20.3+build.1",
        "1.20.4"  : "1.20.4+build.3",
        "1.20.5"  : "1.20.5+build.1",
        "1.20.6"  : "1.20.6+build.3",
        "1.21"    : "1.21+build.9",
        "1.21.1"  : "1.21.1+build.3",
        "1.21.3"  : "1.21.3+build.2",
        "1.21.4"  : "1.21.4+build.8",
        "1.21.6"  : "1.21.6+build.1",
        "1.21.7"  : "1.21.7+build.8",
        "1.21.8"  : "1.21.8+build.1",
        "1.21.9"  : "1.21.9+build.1",
        "1.21.10" : "1.21.10+build.3",
        "1.21.11" : "1.21.11+build.6",
]

// The Java release each Minecraft version was compiled for, which is also the floor for this mod's own
// bytecode: Mixin refuses to apply a mixin class whose class-file version is newer than the config's
// compatibilityLevel, and the game refuses to load a class file newer than its own runtime.
// 1.20 through 1.20.4 run on Java 17; 1.20.5 and everything after it require Java 21.
def javaVersions = [
        "1.20"    : 17,
        "1.20.1"  : 17,
        "1.20.2"  : 17,
        "1.20.3"  : 17,
        "1.20.4"  : 17,
]

def targetYarn = yarnBuilds[targetMc]

if (targetYarn == null) {
    throw new GradleException("No yarn build is listed for Minecraft " + targetMc + "; add it to yarnBuilds in build.gradle")
}

version = "${project.mod_version_base}+mc${targetMc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already adds the repositories needed for Minecraft, Fabric Loader and the mapping artifacts.
}

configurations {
    // OptiFine is remapped from the official (obfuscated) namespace to intermediary at runtime, so the
    // intermediary mappings have to be available inside the built jar. Upstream OptiFabric did the same.
    intermediaryMappings
}

// The mod sources sit in the standard src/main of this project: this branch holds the whole 1.21.x line, so
// there is no second source tree to pull in.

dependencies {
    minecraft "com.mojang:minecraft:${targetMc}"
    mappings "net.fabricmc:yarn:${targetYarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    intermediaryMappings "net.fabricmc:intermediary:${targetMc}:v2"

    // All of these are provided at runtime by Fabric Loader / its launch libraries:
    // ASM and Mixin are launch libraries, and tiny-remapper + mapping-io are shaded inside the loader jar
    // (net.fabricmc.loader.impl.lib.tinyremapper / ...mappingio). Nothing is bundled into this mod.
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-commons:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-analysis:${project.asm_version}"
}

// The mod's own bytecode must not be newer than the release it runs on, so this follows the game: Java 17
// for 1.20 through 1.20.4, Java 21 for 1.20.5 and later. It also has to match the mixin config's
// compatibilityLevel, or Mixin refuses to apply this mod's own two mixins.
def targetJavaVersion = javaVersions.get(targetMc, 21)
def mixinCompatibilityLevel = "JAVA_" + targetJavaVersion

// This line declares "fabric-renderer-api-v1:contains_renderer" so that Indigo steps aside:
// IndigoMixinConfigPlugin then returns false for every one of its mixins and it never registers a renderer.
// That is required here, because on 1.21.x Indigo *is* the terrain renderer and its
// ChunkBuilderBuiltChunkRebuildTaskMixin targets a call that OptiFine's rewrite of that loop removes - with
// "defaultRequire": 1 a missing injection point is fatal.
def indigoComment = "OptiFine is a terrain renderer, so Indigo must step aside. Fabric's own hook for that (Sodium declares the same value): IndigoMixinConfigPlugin.shouldApplyMixin returns false for every fabric-renderer-indigo mixin, and Indigo skips registering its renderer. Without it ChunkBuilderBuiltChunkRebuildTaskMixin fails fatally, because its @Inject targets BlockPos.iterate inside ChunkBuilder.BuiltChunk.RebuildTask.render and OptiFine's rewrite of that loop removes the call."
def customMetadata = "\n    \"_comment\": \"" + indigoComment + "\",\n    \"fabric-renderer-api-v1:contains_renderer\": true"

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", targetMc
    inputs.property "loader_version", project.loader_version
    inputs.property "mixin_compatibility_level", mixinCompatibilityLevel
    inputs.property "optilithium_custom", customMetadata
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": targetMc,
                "loader_version": project.loader_version,
                "optilithium_custom": customMetadata,
                // The id is "optilithium" and it has to stay that way, not for branding but because it is
                // the only thing that gets this mod past Lithium: Lithium declares
                // "breaks": {"optifabric": "*"} and Fabric Loader's solver matches that by id, so a jar
                // called optifabric can never be resolved alongside it. Verified with Loader 0.19.5 -
                // "Immediate reason: [NEG_HARD_DEP lithium ... {breaks optifabric @ [*]}]".
                "optilithium_id": "optilithium",
                "optilithium_name": "OptiLithium",
                "optilithium_verbs": "patches, remaps and applies"
    }

    // The mixin config carries a placeholder: Mixin refuses to apply a mixin class compiled for a newer Java
    // version than its config declares, so this line has to follow the compile release of the project.
    filesMatching("optilithium.mixins.json") {
        expand "mixin_compatibility_level": mixinCompatibilityLevel
    }

    // Bundle the official -> intermediary mappings taken from the intermediary artifact
    from({ zipTree(configurations.intermediaryMappings.singleFile) }) {
        include "mappings/mappings.tiny"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from(file('LICENSE.txt')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named("build") {
    doFirst {
        println "Building ${project.archives_base_name} ${project.version} (Minecraft ${targetMc}, yarn ${targetYarn}," +
                " Fabric Loader ${project.loader_version})"
    }
}
